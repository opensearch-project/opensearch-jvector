name: Build and Test k-NN
on:
  schedule:
    - cron: '0 0 * * *'  # every night
  push:
    branches:
      - "*"
      - "feature/**"
    paths:
      - 'build.gradle'
      - 'settings.gradle'
      - 'src/**'
      - 'build-tools/**'
      - 'buildSrc/**'
      - 'gradle/**'
      - '.github/workflows/CI.yml'
      - '.github/workflows/CI_linux_job.yml'
      - '.github/workflows/CI_linux_native_job.yml'
  pull_request:
    branches:
      - "*"
      - "feature/**"
    paths:
      - 'build.gradle'
      - 'settings.gradle'
      - 'src/**'
      - 'build-tools/**'
      - 'buildSrc/**'
      - 'gradle/**'
      - '.github/workflows/CI.yml'
      - '.github/workflows/CI_linux_job.yml'
      - '.github/workflows/CI_linux_native_job.yml'

jobs:
  Get-CI-Image-Tag:
    uses: opensearch-project/opensearch-build/.github/workflows/get-ci-image-tag.yml@main
    with:
      product: opensearch

  # Each matrix entry calls a reusable workflow, which has its own random jitter job
  # ahead of the container pull, so image pulls are staggered independently.
  Build-k-NN-Linux:
    name: Build and Test jVector k-NN Plugin on Linux (Java ${{ matrix.java }})
    needs: Get-CI-Image-Tag
    strategy:
      fail-fast: false
      matrix:
        java: [21, 25]
    uses: ./.github/workflows/CI_linux_job.yml
    with:
      java: ${{ matrix.java }}
      image: ${{ needs.Get-CI-Image-Tag.outputs.ci-image-version-linux }}
      options: ${{ needs.Get-CI-Image-Tag.outputs.ci-image-start-options }}
      start-command: ${{ needs.Get-CI-Image-Tag.outputs.ci-image-start-command }}
    secrets: inherit

  Build-k-NN-Linux-Native:
    name: Build and Test jVector k-NN Plugin on Linux Native (Java ${{ matrix.java }})
    needs: Get-CI-Image-Tag
    strategy:
      fail-fast: false
      matrix:
        java: [21, 25]
    uses: ./.github/workflows/CI_linux_native_job.yml
    with:
      java: ${{ matrix.java }}
      image: ${{ needs.Get-CI-Image-Tag.outputs.ci-image-version-linux }}
      options: ${{ needs.Get-CI-Image-Tag.outputs.ci-image-start-options }}
      start-command: ${{ needs.Get-CI-Image-Tag.outputs.ci-image-start-command }}
    secrets: inherit

  Build-k-NN-MacOS:
    strategy:
      matrix:
        java: [21, 25]

    name: Build and Test jVector k-NN Plugin on MacOS
    needs: Get-CI-Image-Tag
    runs-on: macos-latest

    steps:
      - name: Checkout jVector k-NN
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java ${{ matrix.java }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Run build
        run: |
          ./gradlew build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: ${{ matrix.java }}-macos-reports
          path: |
            ./build/reports/
            ./build/testclusters/*/logs

  Build-k-NN-Windows:
    strategy:
      matrix:
        java: [21, 25]

    name: Build and Test jVector k-NN Plugin on Windows
    needs: Get-CI-Image-Tag
    runs-on: windows-latest

    steps:
      - name: Checkout jVector k-NN
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java ${{ matrix.java }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Install MinGW Using Scoop
        run: |
          iex "& {$(irm get.scoop.sh)} -RunAsAdmin"
          scoop bucket add main
          scoop install mingw

      - name: Add MinGW to PATH
        run: |
          echo "C:/Users/runneradmin/scoop/apps/mingw/current/bin" >> $env:GITHUB_PATH
          Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
          refreshenv

      - name: Run build
        run: |
          ./gradlew.bat build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: ${{ matrix.java }}-windows-reports
          path: |
            ./build/reports/
            ./build/testclusters/*/logs
