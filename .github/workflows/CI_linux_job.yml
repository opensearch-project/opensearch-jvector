name: Build and Test k-NN on Linux (job)
on:
  workflow_call:
    inputs:
      java:
        description: 'Java version to run the build with'
        required: true
        type: string
      image:
        description: 'CI container image'
        required: true
        type: string
      options:
        description: 'CI container start options'
        required: true
        type: string
      start-command:
        description: 'CI container start command'
        required: true
        type: string
    secrets:
      CODECOV_TOKEN:
        required: false

jobs:
  # Adds random jitter (per caller invocation) to prevent rate limiter triggering on container's registry.
  # The container image is pulled before any step of the job runs, so the delay has to live in a preceding job.
  jitter:
    runs-on: ubuntu-latest
    steps:
      - name: Random Sleep Jitter
        run: |
          # Sleep for a random number of seconds between 10 and 70
          DELAY=$(( ( RANDOM % 30 )  + ( RANDOM % 20 ) + ( RANDOM % 10 ) + 10))
          echo "Sleeping for $DELAY seconds..."
          sleep $DELAY

  Build-k-NN-Linux:
    env:
       CC: gcc10-gcc
       CXX: gcc10-g++
       FC: gcc10-gfortran

    name: Build and Test jVector k-NN Plugin on Linux
    runs-on: ubuntu-latest
    needs: [jitter]
    container:
      # using the same image which is used by opensearch-build team to build the OpenSearch Distribution
      # this image tag is subject to change as more dependencies and updates will arrive over time
      image: ${{ inputs.image }}
      # need to switch to root so that github actions can install runner binary on container without permission issues.
      options: ${{ inputs.options }}

    steps:
      - name: Run start commands
        run: ${{ inputs.start-command }}

      - name: Checkout jVector k-NN
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java ${{ inputs.java }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ inputs.java }}
          distribution: 'temurin'

      - name: Run build
        # switching the user, as OpenSearch cluster can only be started as root/Administrator on linux-deb/linux-rpm/windows-zip.
        run: |
          ulimit -n 65536
          chown -R 1000:1000 `pwd`
          if lscpu  | grep -i avx512f | grep -i avx512cd | grep -i avx512vl | grep -i avx512dq | grep -i avx512bw          
          then
            if lscpu | grep -q "GenuineIntel" && lscpu | grep -i avx512_fp16 | grep -i avx512_bf16 | grep -i avx512_vpopcntdq
            then
              echo "the system is an Intel(R) Sapphire Rapids or a newer-generation processor"
              su `id -un 1000` -c "whoami && java -version && ./gradlew build -Davx512_spr.enabled=true -Dnproc.count=`nproc`"
            else
              echo "avx512 available on system"
              su `id -un 1000` -c "whoami && java -version && ./gradlew build -Davx512.enabled=true -Dnproc.count=`nproc`"
            fi
          elif lscpu  | grep -i avx2
          then
            echo "avx2 available on system"
            su `id -un 1000` -c "whoami && java -version && ./gradlew build -Davx512.enabled=false -Davx512_spr.enabled=false -Dnproc.count=`nproc`"
          else
            echo "avx512 and avx2 not available on system"
            su `id -un 1000` -c "whoami && java -version && ./gradlew build -Davx2.enabled=false -Davx512.enabled=false -Davx512_spr.enabled=false -Dnproc.count=`nproc`"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: ${{ inputs.java }}-linux-reports
          path: |
            ./build/reports/
            ./build/testclusters/*/logs

      - name: Upload Coverage Report
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
