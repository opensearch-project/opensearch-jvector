name: Test jVector k-NN on Secure Cluster
on:
  schedule:
    - cron: '0 0 * * *'  # every night
  push:
    branches:
      - "*"
      - "feature/**"
    paths:
      - 'build.gradle'
      - 'settings.gradle'
      - 'src/**'
      - 'build-tools/**'
      - 'buildSrc/**'
      - 'gradle/**'
      - '.github/workflows/test_security.yml'
      - '.github/workflows/test_security_job.yml'
  pull_request:
    branches:
      - "*"
      - "feature/**"
    paths:
      - 'build.gradle'
      - 'settings.gradle'
      - 'src/**'
      - 'build-tools/**'
      - 'buildSrc/**'
      - 'gradle/**'
      - '.github/workflows/test_security.yml'
      - '.github/workflows/test_security_job.yml'

jobs:
  Get-CI-Image-Tag:
    uses: opensearch-project/opensearch-build/.github/workflows/get-ci-image-tag.yml@main
    with:
      product: opensearch

  # Each matrix entry calls the reusable workflow, which has its own random jitter job
  # ahead of the container pull, so image pulls are staggered independently.
  integ-test-with-security-linux:
    name: Run Integration Tests on Linux (Java ${{ matrix.java }})
    needs: Get-CI-Image-Tag
    strategy:
      matrix:
        java: [21, 25]
    uses: ./.github/workflows/test_security_job.yml
    with:
      java: ${{ matrix.java }}
      image: ${{ needs.Get-CI-Image-Tag.outputs.ci-image-version-linux }}
      options: ${{ needs.Get-CI-Image-Tag.outputs.ci-image-start-options }}
      start-command: ${{ needs.Get-CI-Image-Tag.outputs.ci-image-start-command }}